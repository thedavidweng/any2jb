name: Docs Links

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/docs-links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs-links.yml"

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check internal Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: "node"

      - name: Verify documented upstream pins
        run: node scripts/check-upstream.mjs --offline

      - name: Check internal links and heading anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --offline --include-fragments '*.md' 'docs/**/*.md' 'internal/**/*.md'
          fail: true
