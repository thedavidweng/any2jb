name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false

      - name: Validate tag against mygo.json
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $tag (expected vX.Y.Z)" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          cfg_version=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("mygo.json", "utf8")).version)')
          if [ "$cfg_version" != "$version" ]; then
            echo "mygo.json version ($cfg_version) does not match tag ($tag)" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install JS devDependencies and run quality gates
        run: |
          bun install --frozen-lockfile
          mise run check

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            target: darwin-arm64
          - os: ubuntu-22.04
            platform: linux/amd64
            target: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            target: linux-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "go"
          cache: false

      - name: Build, verify merged bundle, self-test, and stage release artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          go run ./cmd/prepare-runtime -platform "$TARGET"
          go run ./cmd/check-package -platform "$TARGET"

          if [ "$TARGET" = "darwin-arm64" ]; then
            go tool mygo build -platform "$PLATFORM" -sign - -skip-notarize -skip-build-command -o dist
            merged_root="dist/darwin-arm64/any2jb.app/Contents/Resources"
            bin_path="dist/darwin-arm64/any2jb.app/Contents/MacOS/any2jb"
            go run ./cmd/check-package -platform "$TARGET" -merged "$merged_root"
            codesign --verify --deep --strict dist/darwin-arm64/any2jb.app
            "$bin_path" --self-test
            cp "dist/darwin-arm64/any2jb-${VERSION}-arm64.dmg" release-assets/
            ditto -c -k --sequesterRsrc --keepParent dist/darwin-arm64/any2jb.app "release-assets/any2jb-${VERSION}-darwin-arm64.app.zip"
          else
            go tool mygo build -platform "$PLATFORM" -skip-notarize -skip-dmg -skip-build-command -o dist
            merged_root="dist/$TARGET"
            bin_path="dist/$TARGET/any2jb"
            go run ./cmd/check-package -platform "$TARGET" -merged "$merged_root"
            "$bin_path" --self-test
            cp dist/"$TARGET"/any2jb-*.tar.gz release-assets/
            cp dist/"$TARGET"/any2jb_*.deb release-assets/
          fi

          (
            cd release-assets
            for f in *; do
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "${f}.sha256"
              else
                shasum -a 256 "$f" > "${f}.sha256"
              fi
            done
          )

      - name: Upload platform artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-out
          merge-multiple: true

      - name: Assemble checksums.txt and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-out
          cat ./*.sha256 | sort -k2 > checksums.txt
          cat checksums.txt
          gh release create "$TAG" --title "$TAG" --generate-notes ./*
