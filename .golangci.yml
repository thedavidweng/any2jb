version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Conn).SetDeadline
        - (net.Listener).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - github.com/thedavidweng/any2jb/internal/procgroup.Signal
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv
    misspell:
      ignore-rules:
        - cancelled
        - cancelling
        - signalled
        - signalling
        - unrecognised
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: locales/catalog_gen\.go
        linters:
          - all
